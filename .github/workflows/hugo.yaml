name: Deploy Hugo site to Pages

on:
    push:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            HUGO_CACHEDIR: /tmp/hugo_cache
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: "1.27"
                  cache: false

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.165.0"
                  extended: true

            - name: Cache Hugo Modules & Resources
              uses: actions/cache@v6
              with:
                  path: |
                      ${{ env.HUGO_CACHEDIR }}
                      ./resources/_gen
                  key: ${{ runner.os }}-hugo-${{ hashFiles('**/go.sum') }}-${{ hashFiles('content/**') }}
                  restore-keys: |
                      ${{ runner.os }}-hugo-${{ hashFiles('**/go.sum') }}-
                      ${{ runner.os }}-hugo-

            - name: Build with Hugo
              run: hugo --gc --minify --enableGitInfo --templateMetrics --clock=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./public

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5

            - name: Purge Cloudflare cache
              if: success() # Only run if deployment succeeded
              run: |
                  curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE }}/purge_cache" \
                  -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
                  -H "Content-Type: application/json" \
                  --data '{"purge_everything":true}'
